name: Build release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, for example 1.0.1. Leave empty to use the default."
        required: false
        type: string
      publish_release:
        description: "Publish the APK as a GitHub release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag, for example v1.0.1. Used only when publish_release is on."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret found. The APK is signed with the debug key."
          fi

      - name: Build the release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          ARGS="-PversionCode=${{ github.run_number }}"
          if [ -n "$VERSION_NAME" ]; then
            ARGS="$ARGS -PversionName=$VERSION_NAME"
          fi
          gradle --no-daemon :app:assembleRelease $ARGS

      - name: Rename the APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          VERSION="${VERSION_NAME:-build-${{ github.run_number }}}"
          APK="Android-TV-File-Picker-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-File-Picker-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Upload the mapping file
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-File-Picker-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Find the release tag
        if: ${{ inputs.publish_release }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ] && [ -n "$VERSION_NAME" ]; then
            TAG="v$VERSION_NAME"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Set release_tag or version_name to publish a release."
            exit 1
          fi
          echo "RELEASE_TAG_FINAL=$TAG" >> "$GITHUB_ENV"

      - name: Publish the release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG_FINAL }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: true

      - name: Upload the R8 files (if the job failed)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-File-Picker-r8-suggestions
          path: |
            app/build/outputs/mapping/release/missing_rules.txt
            app/build/outputs/mapping/release/configuration.txt
          if-no-files-found: ignore
